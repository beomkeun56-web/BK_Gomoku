<style>
  :root{ --bg:#070a0f; --panel:#0d1118; --line:#1d2230; --txt:#e8edf5; --dim:#8b93a3; --gold:#e8c06a; --blue:#5fb0ff; --red:#ff6b6b; }

  html,body{margin:0;height:100%}

  .row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center}
  select,input,textarea{font-family:inherit; background:#11151d; border:1px solid var(--line); color:var(--txt); border-radius:9px; padding:10px 12px; font-size:.95rem}

  #log{flex:1; padding:18px 16px 8px; overflow-y:auto}

  .you{color:var(--gold); font-size:.9rem; margin:14px 0 4px; font-weight:700}
  .md h1{font-size:1.5rem; font-weight:800; margin:.2em 0 .5em}
  .md h2{font-size:1.18rem; color:#fff; margin:1em 0 .4em}
  .md h2.sec{border-top:1px solid var(--line); padding-top:1em; margin-top:1.3em}
  .md h2 .sm{color:var(--gold); margin-right:.2em}
  .md p{margin:.55em 0}
  .md blockquote{margin:.6em 0; padding:.1em 0 .1em .9em; border-left:3px solid #38414f; color:#9aa3b2}
  .md hr{display:none}
  .md strong{color:#fff}
  .md em{color:#fff; background:#222836; padding:1px 6px; border-radius:5px; font-style:normal}
  .md .good{color:var(--blue)} .md .bad{color:var(--red)}
  .md table{border-collapse:collapse; width:100%; margin:.6em 0; font-size:.92em}
  .md th,.md td{border:1px solid var(--line); padding:6px 9px; text-align:center}
  .md th{background:#171c26; color:#fff}
  /* choices */
  #choices{padding:2px 16px 10px; display:flex; flex-direction:column; gap:8px}
  .choice{text-align:left; background:#0f141c; border:1px solid #25303f; color:var(--txt); border-radius:14px; padding:13px 15px; font-size:1rem; line-height:1.6; transition:.12s}
  .choice:hover{border-color:var(--blue); background:#121a25}
  .choice b{color:var(--blue); margin-right:8px}
  /* input bar */
  #bar{padding:8px 16px 16px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:flex-end; background:var(--bg)}
  #inp{flex:1; resize:none; min-height:44px; max-height:140px}

  @keyframes s{to{transform:rotate(360deg)}}

  dialog::backdrop{background:rgba(0,0,0,.6)}

  .mini{font-size:.82rem; color:var(--dim)}
</style>

<script>
const $=s=>document.querySelector(s);
const LS='reign_artifact_v1';

const SYSTEM = `너는 한국 정치 드라마 텍스트 게임 "권력의 길"의 게임 마스터(GM)다. 모든 출력은 자연스러운 한국어로만 한다. 아래 규칙을 절대 어기지 않는다.

[게임] 플레이어는 대한민국 국회의원. 초선 의원에서 시작해 상임위·당직→장관/원내대표→당대표/대선후보→대선→대통령까지 오르는 정치 드라마. 정치 거래·스캔들·파벌 암투·배신·폭로·검찰 수사·언론 플레이를 활용한다.

[기본 인물 — 별도 지정 없으면 이대로] 주인공: 지범근(남,35), 지역구 강남, 민주당, 성향 "실리주의 협상가"(검사 출신의 냉철함). 보좌관: 이채영(여) — 섹시한 말투의 매력적인, 일 잘하는 여비서(능청·은근한 매력).

[시작 — 1년차 의원, 첫 턴부터 사건] "시작"이라고 하면 주인공은 이미 의정활동 중인 1년차 초선 의원이다. 등원·선서·사무실 배정 같은 도입은 전부 건너뛴다(끝난 상태로 전제). 첫 턴부터 곧바로 사건·갈등·기회를 던진다(스캔들 제보·계파 견제·법안 충돌·폭로·은밀한 거래 제안 등, 활성 톤에 맞게). 배경(상임위·보좌진·지역구)은 사건 속에 한두 문장으로 녹여 알려준다. 잔잔한 행정 도입 금지 — 첫 문장부터 긴장·위트·복선.

[매 턴 출력 형식]
1) 가장 첫 줄은 반드시 '# 제목'. 형식: # **🇰🇷 대한민국 — {핵심 사건}**  다음 줄에 > {한 문장 요약}
2) 상황 전개: 1~2개의 짧은 장면. 소제목(##)은 0~2개, '짧은 명사구'로만(문장형·해설형·감탄수식어·'오늘의~' 금지). 인물 발언은 > 인용. 장면이 바뀌면 소제목이나 '---'로 구분.
3) 본문 맨 끝에 선택지 정확히 3개:
## **✦ 어떻게 하시겠습니까?**
1. "{주인공 1인칭 대사 한 줄}"
2. "{주인공 1인칭 대사 한 줄}"
3. "{주인공 1인칭 대사 한 줄}"
선택지는 실제 발화체(큰따옴표, 15~35자), 서로 다른 방향, 말투·수위도 활성 톤 반영. 선택지 없이 끝내지 말 것(엔딩 제외).
[강조] 그 턴의 특히 긍정·유리한 핵심 문장은 <good>문장</good>, 부정·위험한 핵심 문장은 <bad>문장</bad>로 감싼다(각 0~2개만, 남용 금지). 그 외 HTML 태그 금지.

[문체] 영화처럼 생생하되 간결하게(공백 포함 1,000~1,300자 안팎). 표정·눈빛·말투·긴장을 살아있는 대사 중심으로. ★찰진 입말: 대사는 실제 한국 사람들이 쓰는 살아있는 입말로 찰지게 — 능청·비아냥·떠보기·거친 농담·반어·말끝 흐리기까지. 점잖고 딱딱한 문어체 일색 금지, 인물마다 말투가 다르게. 분노·갈등·뒷거래·술자리의 거친 욕설(젠장·빌어먹을·미친·씨× 수준)은 상황·인물에 맞게 그대로 쓰되 남발 금지. 노골적·선정적 성묘사 금지(암시·감정선·장면전환으로). 미성년 성적묘사 절대 금지.

[인물] 이름은 주어진 그대로(없는 성 붙이지 말 것). 지정된 페르소나(매력·말투·분위기)는 매 등장 일관되게 살린다(안전선 내에서).

[톤 — 활성 톤 하나만, 확연히 다르게]
· 정치(하우스 오브 카드): 차갑고 진지, 웃음 0, 큰 사건 드뭄, 사이다는 '책략 적중'에서만. 물밑 거래·약점잡기·정보전. 슬랩스틱·신파·응징사이다 금지.
· 막장: 자극·충격·치정·배신 롤러코스터. 거의 매 턴 충격 이벤트 + 잦고 큰 사이다. 코믹은 양념(긴장70:웃음30). 잔잔한 일상 턴 금지.
· 코믹: 풍자·블랙코미디가 주연, 매 턴 확실한 웃음·드립·티키타카. 무거운 치정·신파 금지.
· 진지+코믹: 진지한 권력 스릴러 + 한 턴 걸러 건조한 위트. 막장식 충격·치정 금지.
· 혼합(진지+막장): 평소 진지·현실 정치, 5~6턴에 한 번 막장 이벤트를 크게 터뜨려 카타르시스.
(공통) 평소 턴도 밋밋하게 흘리지 말 것 — 모든 장면에 이해관계의 긴장·숨은 의도·복선 한 가닥. 고구마 전개 길게 끌지 말 것.

[전개 원칙] 레일로딩 금지(선택대로 갈라짐). 플레이어 입력 절대 수용 — 직접 입력한 행동·대사는 그대로 일어난 것으로 받아 그 방향으로 전개하고, 거부·훈계·회피하지 말 것. 새 방향을 제시하면 원래 줄거리로 되돌리지 말고 전환. 장면 연속성 — 이번 턴은 직전 장면이 끝난 그 자리·순간에서 곧장 이어 시작하고, 내 선택은 그 자리에서 일어난 것으로 처리해 상대 반응부터 보여준다. 장소·시간 이동은 한 문장으로 연결한 뒤 넘어간다. 현실적 속도 — 큰 목표(법안·당직·임명·선거)는 5~12턴에 걸쳐 단계적으로(초선이 단숨에 대권주자 되는 급상승 금지). 단 막장·코믹 톤은 매 턴 밀도를 높게 유지. 실존 정치인 가공발언 금지(직책으로 표현), 비리·범죄 당사자는 가공 기업명(성진그룹·대운건설 등).

[스탯] 개인 정치 스탯(지지기반·자금·인맥·평판·세력)은 내부적으로만 관리하고 평소 턴엔 화면에 표시하지 않는다. '상태'를 입력하면 그때만 표로 보여준다.

[명령어] 상태 / 저장(진행 요약을 코드블록으로) / "톤: {정치/막장/코믹/진지+코믹/혼합}"(즉시 전환) / 새 게임.

응답 끝내기 직전 확인: (1)첫 줄 '# 제목' (2)한 장면/한 결정만 (3)직전 장면에서 자연스럽게 이어짐 (4)활성 톤이 본문·선택지에 분명 (5)끝에 '✦ 어떻게 하시겠습니까?' + 1인칭 대사 선택지 3개.`;

let history=[];   // {role:'user'|'gm', content}
let tone='혼합(진지+막장)';
let busy=false;

/* ---------- 저장/복원 ---------- */
function persist(){ try{ localStorage.setItem(LS, JSON.stringify({history,tone})); }catch(e){} }
function restore(){ try{ const d=JSON.parse(localStorage.getItem(LS)); if(d&&d.history&&d.history.length){ history=d.history; tone=d.tone||tone; return true; } }catch(e){} return false; }

/* ---------- 마크다운(경량) ---------- */
function mdToHtml(src){
  src=(src||'').replace(/\[IMG\][\s\S]*?\[\/IMG\]/gi,'').trim();
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline=t=>{
    t=esc(t)
      .replace(/&lt;good&gt;([\s\S]*?)&lt;\/good&gt;/g,'<span class="good">$1</span>')
      .replace(/&lt;bad&gt;([\s\S]*?)&lt;\/bad&gt;/g,'<span class="bad">$1</span>')
      .replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*([^*]+?)\*/g,'<em>$1</em>');
    return t;
  };
  const lines=src.split('\n'); let html='', i=0;
  while(i<lines.length){
    let l=lines[i];
    const t=l.trim();
    if(t===''){ i++; continue; }
    if(/^-{3,}$/.test(t)){ i++; continue; }                 // hr 숨김
    let m;
    if(m=t.match(/^#\s+(.+)$/)){ html+='<h1>'+inline(m[1].replace(/^\*\*|\*\*$/g,''))+'</h1>'; i++; continue; }
    if(m=t.match(/^##\s+(.+)$/)){ let txt=m[1].replace(/^\*\*|\*\*$/g,'').replace(/✦/g,'').trim();
      html+='<h2 class="sec"><span class="sm">✦</span>'+inline(txt)+'</h2>'; i++; continue; }
    if(m=t.match(/^###\s+(.+)$/)){ html+='<h3>'+inline(m[1])+'</h3>'; i++; continue; }
    if(t.startsWith('>')){ let buf=[]; while(i<lines.length && lines[i].trim().startsWith('>')){ buf.push(lines[i].trim().replace(/^>\s?/,'')); i++; } html+='<blockquote>'+inline(buf.join('<br>'))+'</blockquote>'; continue; }
    if(t.startsWith('|') && lines[i+1] && /^\|[\s:|-]+\|$/.test(lines[i+1].trim())){   // 표
      let rows=[]; while(i<lines.length && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      html+=renderTable(rows,inline); continue;
    }
    if(m=t.match(/^[-*]\s+(.+)$/)){ let buf=[]; while(i<lines.length && /^[-*]\s+/.test(lines[i].trim())){ buf.push('<li>'+inline(lines[i].trim().replace(/^[-*]\s+/,''))+'</li>'); i++; } html+='<ul>'+buf.join('')+'</ul>'; continue; }
    html+='<p>'+inline(t)+'</p>'; i++;
  }
  return html;
}
function renderTable(rows,inline){
  const cells=r=>r.split('|').slice(1,-1).map(c=>c.trim());
  let h=cells(rows[0]); let body=rows.slice(2).map(cells);
  let out='<table><thead><tr>'+h.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
  body.forEach(r=>{ out+='<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; });
  return out+'</tbody></table>';
}

/* ---------- 선택지 분리 ---------- */
function splitChoices(text){
  const idx=text.search(/##\s*\*{0,2}\s*✦?\s*어떻게/);
  if(idx<0){
    // 헤더 없이 끝에 1.2.3 만 있는 경우
    const tc=trailing(text); if(tc) return tc;
    return {body:text.trim(), choices:[]};
  }
  const body=text.slice(0,idx).trim();
  const tail=text.slice(idx);
  return {body, choices:collect(tail)};
}
function trailing(text){
  const lines=text.split('\n'); let start=lines.length, found=[];
  for(let j=lines.length-1;j>=0;j--){ const s=lines[j].trim();
    if(s===''){ if(found.length) break; else continue; }
    if(/^\d+[.)]/.test(s)){ found.unshift(s); start=j; } else break; }
  if(found.length>=2){ const c=collect(found.join('\n')); if(c.length>=2) return {body:lines.slice(0,start).join('\n').trim(), choices:c}; }
  return null;
}
function collect(tail){
  const out=[]; const re=/^\s*(\d+)[.)]\s*(.+)$/gm; let m,last=0;
  while(m=re.exec(tail)){ const n=+m[1]; if(n<=last) break; let s=m[2].trim().replace(/^\*\*|\*\*$/g,'').replace(/^["“'']|["”'']$/g,''); out.push(s); last=n; if(out.length>=4) break; }
  return out;
}

/* ---------- 렌더 ---------- */
const log=$('#log'), choicesEl=$('#choices');
function addTurn(role, content, choices){
  if(role==='user'){ const d=document.createElement('div'); d.className='you'; d.textContent='▸ '+content; log.appendChild(d); return; }
  const wrap=document.createElement('div'); wrap.className='turn md'; wrap.innerHTML=mdToHtml(content); log.appendChild(wrap);
  renderChoices(choices||[]);
  log.scrollTop=log.scrollHeight;
}
function renderChoices(cs){
  choicesEl.innerHTML='';
  cs.forEach((c,idx)=>{ const b=document.createElement('button'); b.className='choice'; b.innerHTML='<b>'+(idx+1)+'</b>'+c.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    b.onclick=()=>{ if(busy) return; send('"'+c+'"', c); }; choicesEl.appendChild(b); });
  choicesEl.scrollIntoView({block:'nearest'});
}

/* ---------- GM 호출 ---------- */
function historyText(){
  const keep=history.slice(-18);
  return keep.map(m=>(m.role==='user'?'[플레이어] ':'[GM] ')+m.content).join('\n\n');
}
async function callGM(userMsg){
  const prompt = SYSTEM
    + '\n\n[활성 드라마 톤 = "'+tone+'"] 이 톤을 최우선으로 유지하라(본문·선택지 모두).'
    + (history.length? ('\n\n[지금까지의 진행]\n'+historyText()) : '')
    + '\n\n[플레이어 입력]\n'+userMsg
    + '\n\n위 [매 턴 출력 형식]대로, 직전 장면에서 자연스럽게 이어 다음 턴을 한국어로 출력하라. 반드시 첫 줄은 # 제목, 끝은 ✦ 선택지 3개.';
  if(!(window.claude && typeof window.claude.complete==='function'))
    throw new Error('이 기능은 Claude 아티팩트 안에서만 동작합니다 (window.claude.complete 없음).');
  const out = await window.claude.complete(prompt);
  if(!out || !out.trim()) throw new Error('빈 응답이 왔습니다. 다시 시도해 주세요.');
  return out.trim();
}

async function send(promptMsg, displayMsg){
  if(busy) return; busy=true;
  $('#busy').classList.remove('hidden'); choicesEl.innerHTML=''; $('#btnSend').disabled=true;
  // 톤 변경 명령
  const tm=(displayMsg||promptMsg).match(/^톤\s*[:：]\s*(.+)$/);
  if(tm){ const map={'정치':'정치(하우스 오브 카드)','막장':'막장','코믹':'코믹','진지+코믹':'진지+코믹','혼합':'혼합(진지+막장)'};
    tone=map[tm[1].trim()]||tm[1].trim(); persist();
    $('#busy').classList.add('hidden'); busy=false; $('#btnSend').disabled=false;
    addTurn('user','톤 변경 → '+tone); renderChoices(lastChoices); return; }
  addTurn('user', displayMsg||promptMsg);
  history.push({role:'user', content: promptMsg});
  try{
    const out=await callGM(promptMsg);
    const {body, choices}=splitChoices(out);
    history.push({role:'gm', content: out});
    lastChoices=choices.length?choices:lastChoices;
    addTurn('gm', body, choices);
    persist();
  }catch(e){
    history.pop();   // 실패 턴 롤백
    const er=document.createElement('div'); er.className='err'; er.textContent='⚠️ '+e.message; log.appendChild(er);
    renderChoices(lastChoices);
  }finally{
    busy=false; $('#busy').classList.add('hidden'); $('#btnSend').disabled=false;
    log.scrollTop=log.scrollHeight;
  }
}
let lastChoices=[];

/* ---------- 화면 전환 ---------- */
function showGame(){ $('#welcome').classList.add('hidden'); ['#topbar','#log','#choices','#bar','#hint'].forEach(s=>$(s).classList.remove('hidden')); }
function startNew(){ history=[]; lastChoices=[]; log.innerHTML=''; tone=$('#tone').value; persist(); showGame(); send('시작','시작'); }

/* ---------- 이벤트 ---------- */
$('#ctaStart').onclick=startNew;
$('#btnNew').onclick=()=>{ if(confirm('새 게임을 시작할까요? 현재 진행은 사라집니다(저장본은 남음).')) startNew(); };
$('#btnSend').onclick=()=>{ const v=$('#inp').value.trim(); if(!v) return; $('#inp').value=''; send(v,v); };
$('#inp').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); $('#btnSend').click(); } });
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>send(b.dataset.cmd,b.dataset.cmd));
$('#inp').addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(140,this.scrollHeight)+'px'; });

/* 저장/불러오기 (복사 기반 — 아티팩트 영구저장이 불안정할 때 대비) */
const dlg=$('#dlg');
$('#btnSave').onclick=()=>{ persist(); $('#dlgTitle').textContent='저장 (백업)'; $('#dlgDesc').textContent='아래 전체를 복사해 보관하세요. 다른 기기/대화에서 [저장본 불러오기]에 붙여넣으면 이어집니다.'; $('#dlgArea').value=JSON.stringify({history,tone}); $('#dlgDoLoad').classList.add('hidden'); dlg.showModal(); };
function openLoad(){ $('#dlgTitle').textContent='저장본 불러오기'; $('#dlgDesc').textContent='저장해둔 텍스트를 붙여넣고 [불러오기]를 누르세요.'; $('#dlgArea').value=''; $('#dlgDoLoad').classList.remove('hidden'); dlg.showModal(); }
$('#btnLoad').onclick=openLoad; $('#ctaLoad').onclick=openLoad;
$('#dlgCopy').onclick=()=>{ $('#dlgArea').select(); document.execCommand('copy'); };
$('#dlgClose').onclick=()=>dlg.close();
$('#dlgDoLoad').onclick=()=>{ try{ const d=JSON.parse($('#dlgArea').value); if(!d.history) throw 0; history=d.history; tone=d.tone||tone; persist(); dlg.close(); log.innerHTML=''; lastChoices=[]; showGame();
  // 마지막 GM 턴 다시 렌더
  for(const m of history){ if(m.role==='user'){ if(m.content!=='시작'&&!/^톤\s*[:：]/.test(m.content)) addTurn('user', m.content.replace(/^"|"$/g,'')); } else { const {body,choices}=splitChoices(m.content); lastChoices=choices.length?choices:lastChoices; if(m===history[history.length-1]||history.indexOf(m)===lastGmIndex()) addTurn('gm',body,choices); else { const w=document.createElement('div'); w.className='turn md'; w.innerHTML=mdToHtml(body); log.appendChild(w);} } }
  renderChoices(lastChoices);
 }catch(e){ alert('형식이 올바르지 않습니다.'); } };
function lastGmIndex(){ for(let i=history.length-1;i>=0;i--) if(history[i].role==='gm') return i; return -1; }

/* 폰트 크기 조절 (4단계 순환) */
const FS=[15,17,19,21]; let fsi=parseInt(localStorage.getItem(LS+'_fs')||'1')||1;
function applyFs(){ document.body.style.fontSize=FS[fsi]+'px'; try{localStorage.setItem(LS+'_fs',String(fsi));}catch(e){} }
$('#btnFont').onclick=()=>{ fsi=(fsi+1)%FS.length; applyFs(); }; applyFs();

/* 시작 시 자동 복원 */
if(restore()){
  $('#tone').value=tone; showGame();
  for(const m of history){ if(m.role==='user'){ if(m.content!=='시작'&&!/^톤\s*[:：]/.test(m.content)) addTurn('user', m.content.replace(/^"|"$/g,'')); } else { const {body,choices}=splitChoices(m.content); lastChoices=choices.length?choices:lastChoices; const w=document.createElement('div'); w.className='turn md'; w.innerHTML=mdToHtml(body); log.appendChild(w); } }
  renderChoices(lastChoices); log.scrollTop=log.scrollHeight;
}
</script>
</body>
